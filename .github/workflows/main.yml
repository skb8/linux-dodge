name: OnePlus 13 - Mu Linux payload

on:
  push:
    branches: [v6.16]
  pull_request:
    branches: [v6.16]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dodge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        display: [firmware, native]
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      LLVM: '-18'
      KBUILD_BUILD_USER: github-actions
      KBUILD_BUILD_HOST: linux-dodge
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            clang-18 lld-18 llvm-18 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            zstd xz-utils python3
      - name: Build kernel, device tree and modules
        env:
          DISPLAY_PROFILE: ${{ matrix.display }}
        run: bash scripts/build-dodge-mu.sh
      - name: Upload boot payload
        uses: actions/upload-artifact@v4
        with:
          name: dodge-mu-${{ matrix.display }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dodge-logs-${{ matrix.display }}-${{ github.sha }}
          path: |
            build-logs/
            out/.config
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
